[project]
name = "mush"
version = "0.1.0"
description = "Multi-User Session Host - PTY daemon for safe human–agent joint operation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cffi>=1.16.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "msgpack>=1.0.7",
]
authors = [
    {name = "MemoGarden Project"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems",
    "Topic :: Terminals :: Terminal Emulators",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.96.0",
    "pytest-cov>=4.1.0",
    "coverage[toml]>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/memogarden/mush"
Repository = "https://github.com/memogarden/mush"
Documentation = "https://memogarden.github.io/mush"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mush"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--cov= mush",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["mush"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
