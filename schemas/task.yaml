# MemoGarden Task Entity Schema
# The tada ontology: Task = a REQUEST (Core entity, mutable while in
# flight); Event = an OCCURRENCE (Soil fact, immutable once realized —
# see event.yaml's FACT section). Resolution is CONVERSION, not a stamp.

# ==============================================================================
# ENTITY TYPE
# ==============================================================================
type: Task
tier: Core entity (mutable belief — `core_` uuid)
extends: none
description: >
  A REQUEST — something to be carried out. Mutable while in flight; the
  belief-layer analogue of the gcal Event entity (event.yaml). A Task never
  records that anything happened: it carries NO terminal stamp, and its
  lifecycle ends in conversion (see RESOLUTION), not in a status flip.
  Requests can change while still in flight — source edits update the
  entity (the delta stream is the change history); no fact per edit.

  Supersedes the retired Task FACT type (schemas/types/facts/task.schema.json):
  the 2026-11-19 review rejected 'Todo' as ontologically unclear and made
  Task the request-entity; the old task facts are backported to Event facts.

# ==============================================================================
# DATA FIELDS (Source-Agnostic Request Model)
# ==============================================================================
data:
  # Identity and natural key
  source_id:
    type: string
    required: true
    description: Native request id in the source system. Natural-key half
      (with metadata.source); the Task analogue of Email.rfc_message_id.
    example: "01a1a5fc-52cf-768a-8261-e3b94da7972a"

  title:
    type: string
    required: true
    description: Request title (current belief).

  kind:
    type: string
    required: false
    description: Documented convention 'task' | 'event' (free string,
      extensible by schema revision). tada's item kinds.
    example: "task"

  status:
    type: string
    enum: ["confirmed", "tentative"]
    required: true
    description: IN-FLIGHT ONLY. There is no completed/cancelled here —
      those are conversions, not states. (The gcal Event entity's status
      carries the same in-flight semantics; the convergence of the two is
      a future slice.)

  start_at:
    type: datetime-UTC | null
    required: false
    description: The slot the request targets (ISO 8601 UTC, provider-
      converted from the source zone). Absent/null = floating — absence
      IS the state.

  duration:
    type: string
    required: false
    description: ISO-8601 duration, as given by the source.

  time_zone:
    type: string
    required: false
    description: Source zone the naive wall times were converted from
      (provenance for re-derivation).

  appear_after:
    type: date
    required: false
    description: Local date; deferred visibility gate (tada §10.33).

  notify:
    type: boolean
    required: false

  focus:
    type: boolean
    required: false

  tags:
    type: array
    items: string
    required: false
    description: Current tags (belief-layer, mutable).

  recurrence_of:
    type: string
    required: false
    description: NATIVE uid of the Recurrence (schemas/recurrence.yaml)
      this occurrence materialized from; absent on non-series requests.
      Dangling-proof native reference. Deliberately NOT 'recurrence_id' —
      in iCalendar that name means the RECURRENCE-ID property (which
      instance was modified), different semantics.

  follows_from:
    type: string
    required: false
    description: NATIVE predecessor uid (tada §10.32 follow-on chains).
      Written on the successor only; the reverse direction is derivable
      by query.

# ==============================================================================
# METADATA FIELDS (Provider-Specific)
# ==============================================================================
# Storage merges these FLAT into entity.data (single JSON column — the
# gcal event.schema.json precedent); the split is a documentation grammar.

metadata:
  source:
    type: string
    required: true
    description: Source system. Natural-key half. Grows with sources.

  etag:
    type: string
    required: true
    description: Source-side change token (tada item updatedAt). Drives the
      provider-runtime no-op rule (etag + source_status unchanged → skip).
      A Task deliberately carries NO source_status — its lifecycle ends in
      conversion, not stamping, so the no-op degenerates to etag-only
      (None == None on the stamp field).

  tada_source:
    type: string
    required: false
    description: tada's own provenance passthrough (e.g. 'ticktick' for
      imported items).

# ==============================================================================
# NATURAL KEY (provider upserts)
# ==============================================================================
# (metadata.source, data.source_id) — same key ⇒ same entity; etag-diff
# decides no-op vs update. Runtime: find_by_data + merge semantics
# (incoming keys overwrite, absent keys keep stored, explicit null clears).

# ==============================================================================
# RESOLUTION — CONVERSION, not a stamp (the ontology's load-bearing rule)
# ==============================================================================
# When the source resolves the request (carried out / decided-against):
#   1. the provider yields an EVENT FACT (event.yaml FACT section;
#      metadata.status records the verdict, canonical_at the honesty rule)
#   2. the provider yields {op: "retire_entity", type: "Task", key} —
#      Tombstone supersession (/mg forget's mechanism, minus the identity
#      guard), idempotent on gone keys
# Ordering contract: the Event fact is yielded BEFORE the retire; a crash
# between them converges on replay (done-set re-delivers, retire is a
# noop). A retired Task with no Event record is the unrecoverable
# direction and must never occur.
# Content rule: prose never rides the entity — Note facts (contained_by)
# carry content, landing at resolution.

# ==============================================================================
# RELATIONS
# ==============================================================================
# None required v1. recurrence_of / follows_from are native references
# (promotable to relations when a consumer needs graph linkage).

# ==============================================================================
# EXAMPLE
# ==============================================================================
example:
  _type: "Task"
  uuid: "core_9f2c..."
  data:
    source_id: "3f1c8a2e-01b7-4c2d-9e4f-5a6b7c8d9e0f"
    title: "roller blinds 1.8m"
    kind: "task"
    status: "confirmed"
    start_at: null
    time_zone: "Asia/Singapore"
    tags: ["buy"]
    recurrence_of: "8b2d1f4c-..."
    follows_from: "0c9d8b7a-..."
  # merged flat at storage:
  #   source: "tada"
  #   etag: "2026-11-19T08:41:00"
  #   tada_source: null
