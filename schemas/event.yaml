# MemoGarden Event — TWO LAYERS, ONE NAME
# =====================================================================
# This file documents the EVENT ENTITY (below, RFC-014 gcal). The EVENT
# FACT — the universal occurrence record, `soil_` uuid — is documented in
# the FACT section at the foot of this file; its machine schema is
# schemas/types/facts/event.schema.json.
#
# Layer disambiguation: the Event ENTITY is a BELIEF about a concrete
# scheduled occurrence (gcal; `core_` uuid; never a fact by itself —
# mark-occurred is its only fact path). The Event FACT is the immutable
# memory that something HAPPENED (`soil_` uuid; authored by conversion
# from a Task, or provider yield, or /mg add once #29 whitelists it).
# Same word, different layers — disambiguated by uuid prefix and
# query target_type. CONVERGED 2026-11-19 (#31): mark-occurred emits
# Event facts; the EventOccurrence type is retired (zero instances
# existed at convergence).
#
# RFC-014: plan/rfc_014_gcal_provider_v1.md
# Grammar: source-agnostic data / provider metadata split, §-banners,
# one full example per layer.

# ====================================================================
# § ENTITY TYPE
# ====================================================================
type: Event
tier: Core entity (mutable belief — `core_` uuid)
extends: none

description: >
  An Event is a BELIEF about a concrete, scheduled occurrence — the
  calendar as the user understands it, not a bank-ledger of what happened.

  Governing rules:
  - An Event never becomes a Soil fact by itself. It yields an immutable
    fact only when review explicitly marks it occurred (mark-occurred
    action) — NEVER when its date passes silently.
  - Events are individual instantiations. They never carry recurrence:
    a series contributes many Events, each linked (optionally) to its
    source pattern via a NATIVE reference in metadata (recurring_event_id).
  - There is no all_day flag: absence of time information in
    starts_at/ends_at IS the time ambiguity (naturally "all-day").
  - ends_at is EXCLUSIVE (interval convention; RFC 5545 DTEND — a one-day
    date-only event ends on the NEXT day).
  - Source edits update the entity (the delta stream is the change
    history). No fact is created per edit.

# ====================================================================
# § DATA FIELDS (Source-Agnostic Belief Model)
# ====================================================================
data:
  source_id:
    type: string
    required: true
    description: >
      NATIVE source id (the Event analogue of Email.rfc_message_id).
      Unique per calendar, not globally ("collisions aren't guaranteed
      detectable" across calendars) — the natural key therefore carries
      calendar_id from metadata.

  title:
    type: string
    required: false
    description: >
      Optional: untitled events exist, and validation stays minimal
      (over-strict validation would permanently exclude real events).

  description:
    type: string
    required: false

  location:
    type: string
    required: false

  starts_at:
    type: datetime-UTC | date (YYYY-MM-DD)
    required: true
    description: >
      Timed events are UTC-converted from the source timezone (provider
      responsibility). Date-only values carry NO time and NO timezone:
      the missing time IS the ambiguity (naturally treated as all-day).

  ends_at:
    type: datetime-UTC | date (YYYY-MM-DD)
    required: false
    description: >
      EXCLUSIVE end (duration = ends_at − starts_at). For date-only
      events the end date is exclusive too: a one-day event on 2026-11-16
      ends on 2026-11-17.

  occurred_at:
    type: datetime-UTC
    required: false
    description: >
      Null/absent = the event has not happened / did not happen.
      Set ONLY by the mark-occurred review action. Providers NEVER set
      it; date passage NEVER sets it ("never silently converted after
      date past").

  did_not_occur:
    type: boolean
    required: false
    description: >
      The dismiss review stamp (RFC-014 amendment 2026-11-26, api#57):
      mark-occurred's symmetric sibling. Set ONLY by the dismiss action
      (POST /api/v1/events/<uuid>/dismiss). Review stamps are TERMINAL:
      once either occurred_at or did_not_occur exists, the review state
      is closed — mark-after-dismiss and dismiss-after-mark are 409, and
      un-stamping is not offered (immutability lives at the review-API
      layer; Soil stays sovereign, SG-11).

  dismissed_at:
    type: datetime-UTC
    required: false
    description: >
      The dismissal moment (defaults to now at dismiss time). Unlike
      occurred_at there is NO not-in-the-future rule — dismissing a
      future slot is legitimate (the slot will not happen);
      occurred_at keeps its rule because an occurrence cannot postdate
      its stamp.

  status:
    type: enum
    enum: [confirmed, tentative]
    required: true
    description: >
      Source truth of the schedule. Cancelled events are NOT stored as
      Events — removal is stamped on the entity instead
      (metadata.source_status / removed_at_source / detection_source).

  participants:
    type: [string]
    required: false
    description: >
      Plain identifier strings — email address preferred, displayName or
      other identifying string as fallback. No Person entity exists yet;
      emails give a stable join key when one lands. Capped at
      participants_max (default 50); metadata.attendee_count preserves
      the true count.

  organizer:
    type: string
    required: false
    description: Email or identifying string preferred.

# ====================================================================
# § METADATA FIELDS (Provider-Specific)
# ====================================================================
metadata:
  source:
    type: enum
    enum: [google_calendar]      # enum grows with providers
    required: true

  account:
    type: string                 # verified upstream identity (email)
    required: true
    description: >
      RFC-012 INV-7 attribution. Scope-rule matchable. Provider-managed
      provenance outside the belief fields.

  calendar_id:
    type: string
    required: true
    description: Part of the natural key (per-calendar id uniqueness).

  calendar_summary:
    type: string
    required: false

  event_id:
    type: string
    required: true
    description: Native id; duplicated from data.source_id for key clarity.

  ical_uid:
    type: string
    required: false
    description: Cross-system identifier (stable across calendars/systems).

  etag:
    type: string
    required: true
    description: >
      Source change token for the entity; drives upsert no-op detection
      (same etag ⇒ no write, no delta).

  updated_at:
    type: datetime-UTC
    required: false
    description: Source-side last-modification time.

  recurring_event_id:
    type: string
    required: false
    description: >
      NATIVE id of the source pattern (recurrence series) this
      instantiation belongs to. Stored NATIVE so the reference never
      dangles regardless of ingest order (tada follows_from precedent).
      RRULE text capture is deferred — instances omit recurrence lines.

  original_start_at:
    type: datetime-UTC
    required: false
    description: >
      For moved instances: the start time this instance had in the
      series before the move.

  captured_after_fact:
    type: boolean
    required: false
    description: >
      True for seeded history — the calendar asserted the event, but we
      never live-observed it. Review triage marker distinguishing
      "scheduled, never live-observed" from live-captured events.

  source_status:
    type: enum
    enum: [cancelled]
    required: false
    description: >
      Removal stamp: the source reported this event deleted/cancelled.
      Companion stamps: removed_at_source (when we observed it),
      detection_source (sync_tombstone | audit_diff).

  removed_at_source:
    type: datetime-UTC
    required: false

  detection_source:
    type: enum
    enum: [sync_tombstone, audit_diff]
    required: false

  self_response:
    type: enum
    enum: [accepted, declined, tentative, needsAction]
    required: false
    description: The account owner's own RSVP (attendees[].self=true).

  attendee_count:
    type: integer
    required: false
    description: True attendee count when participants were trimmed (cap 50).

# ====================================================================
# § STORAGE MAPPING (Core entity storage — RFC-014 §2.2/§3.2)
# ====================================================================
# Core entities have a SINGLE JSON data column (no metadata column), so
# the data + metadata split above is a DOCUMENTATION split: at storage
# time the provider yields {data, metadata} and the runtime merges them
# flat into entity.data (key collision between the two is a contract
# violation and fails the run). Consequences:
#   - every field above is top-level in entity.data and json_extract-
#     matchable (scope rules key on $.account / $.calendar_id);
#   - runtime-applied scope labels ride data.scopes (the entity analogue
#     of fact metadata.scopes);
#   - updates MERGE incoming keys over stored values (absent keys keep
#     stored values; explicit null clears) — tombstone payloads carry
#     stamps only and must never clobber belief fields.

# ====================================================================
# § NATURAL KEY (provider upserts)
# ====================================================================
# (metadata.source, metadata.account, metadata.calendar_id, data.source_id)
# Same key ⇒ same entity; etag-diff decides no-op vs update.

# ====================================================================
# § FACTS (how an Event yields memory) — IMPLEMENTED, RFC-014 §6
# (PRE-CONVERGENCE SHAPE BELOW — superseded 2026-11-19 (#31) by the
# § EVENT FACT section at the foot; mark-occurred now emits the
# universal Event fact, not an EventOccurrence.)
# ====================================================================
# An Event never becomes a fact by itself. The mark-occurred review
# action (POST /api/v1/events/<uuid>/mark-occurred; operator JWT or
# agent-bound API key, unbound keys 403) creates:
#
#   - EventOccurrence fact (Soil, immutable):
#       data: {event_uuid (core_-prefixed), occurred_at,
#              snapshot{title, starts_at, ends_at, location,
#                       participants, organizer, status}}
#       metadata: {source, account, calendar_id, source_id}  (provenance)
#       canonical_at = occurred_at
#   - Action fact: attributable marking
#       data: {actor, actor_type (operator|agent), operation:
#              "mark_occurred", params{event_uuid, occurred_at}}
#
# Idempotent: re-marking returns the existing occurrence (200, no new
# facts). Crash-repair: if the entity is marked but its facts are
# missing (core-first commit ordering), re-marking recreates the facts
# from the entity's stored stamp without overwriting ground truth.
# EventOccurrence is deliberately NOT in the /mg baseline create
# whitelist — this endpoint is the fact's only creation path.

# ====================================================================
# § RELATIONS
# ====================================================================
# None required v1. recurring_event_id is promotable to a relation when a
# consumer needs pattern linkage (tada follows_from promotion precedent).

# ====================================================================
# § EXAMPLE
# ====================================================================
# A moved instance of a weekly series, seeded from history, later marked
# occurred by an agent:
#
# _type: Event (Core entity)
# uuid: core_9f2c...        # core_ prefix
# data:
#   source_id: "q8h1vabc_20261028T090000Z"
#   title: "Weekly sync"
#   starts_at: "2026-10-28T09:15:00+00:00"   # moved +15 min from 09:00
#   ends_at: "2026-10-28T10:00:00+00:00"
#   occurred_at: null                         # not yet reviewed
#   status: "confirmed"
#   participants: ["a@example.com", "b@example.com"]
#   organizer: "me@example.com"
# metadata:
#   source: "google_calendar"
#   account: "me@gmail.com"
#   calendar_id: "me@gmail.com"               # primary calendar
#   calendar_summary: "Personal"
#   event_id: "q8h1vabc_20261028T090000Z"
#   ical_uid: "q8h1vabc@google.com"
#   etag: "\"3456789012345678\""
#   updated_at: "2026-10-27T18:02:11+00:00"
#   recurring_event_id: "q8h1vabc"            # series link (native)
#   original_start_at: "2026-10-28T09:00:00+00:00"
#   captured_after_fact: true                  # seeded from history
#   attendee_count: 2
#   self_response: "accepted"

# ====================================================================
# § EVENT FACT (occurrence record) — the OTHER layer of the name
# ====================================================================
# `soil_` uuid · machine schema: schemas/types/facts/event.schema.json
# · THE universal occurrence record (tada lane live; gcal's
#   EventOccurrence converged here 2026-11-19 — #31).
#
# An Event fact is immutable memory that something HAPPENED. Three
# authors: (1) CONVERSION from a Task entity (the tada ontology's
# resolution — see task.yaml RESOLUTION); (2) provider yield (the tada
# day-walk's outage backstop); (3) /mg add once #29 whitelists the type
# for direct agent authoring.
#
# DATA (flat, minimal-required — absence IS the state):
#   source_id    required — native occurrence id; the dedup key
#   title        optional (untitled occurrences exist)
#   kind         'task' | 'event' convention
#   start_at     the slot it was meant for (UTC); absent = floating
#   ends_at      EXCLUSIVE end (RFC 5545) — the ONE interval convention;
#                duration-carrying sources convert provider-side
#   location / participants / organizer   short structured fields, inline
#   event_uuid   optional core_ link to the gcal belief entity (tada
#                facts omit it: the Task is retired AT conversion —
#                native source_id is the stable join)
#   tags         at resolution time
#
# METADATA:
#   source       required — 'tada' | 'google_calendar' | ...
#   status       required — the terminal verdict, SOURCE VOCABULARY:
#                tada 'completed' | 'cancelled' | 'skipped' (reserved
#                for sources that record skips); gcal 'occurred' at
#                convergence (normalizing gcal to 'completed' would be a
#                semantic loss — decided at the convergence review);
#                gcal 'did_not_occur' for the dismiss verdict (RFC-014
#                amendment 2026-11-26, api#57 — the recorded
#                non-occurrence, visible in the timeline rather than a
#                silent gap; optional metadata.reason carries the
#                reviewer's stated reason)
#   resolved_at  the decision/observation moment (was task facts'
#                status_updated_at)
#   day          tada day-walk provenance
#   recurrence_of / follows_from   native links (Task entity's fields,
#                carried into memory at conversion)
#   task_source_id  the Note-linkage key (Notes resolve their anchor by
#                this native id — historical name kept; renaming would
#                amend 833 immutable facts for cosmetics)
#   tada_source  provenance passthrough
#   account / calendar_id   gcal convergence fields
#
# CANONICAL_AT honesty rule (generalized from task facts):
#   completed  -> resolved_at (when it finished)
#   cancelled  -> start_at (the slot it was meant for — the honest "when
#                 it happened" for a task that didn't), falling back to
#                 resolved_at when there was no slot
#   skipped    -> the cancelled rule (didn't happen: slot, else decision)
#   gcal convergence -> the actual occurrence time (was occurred_at)
#   gcal did_not_occur -> the cancelled rule (the slot it was meant for,
#                falling back to the dismissal moment when there was no
#                slot) — a recorded non-occurrence happened "at" its
#                missed slot or not at all
#   Providers set it deliberately; date passage never sets it silently.
#
# CONVERSION ordering contract: the Event fact lands BEFORE the Task
# retire — a crash between them converges on replay (done-set re-delivers
# the fact; the retire is an idempotent noop). The reverse (a retired
# Task with no Event record) is the unrecoverable direction.
