# MemoGarden Browser Session Schema (RFC-013)
# Language-agnostic definition for browser sessions as first-class PIS entities.
# Design of record: plan/rfc_013_browser_session_host_v1.md (+ §12 spike findings)

# ==============================================================================
# ITEM TYPE
# ==============================================================================
type: Session
extends: Entity (Core) + local staging cache (daemon custody)
description: >
  A browser session is a named Chromium profile (user-data-dir) with lifecycle,
  operator⇄agent co-control, and download capture. Opaque browser state
  (cookies, site data, SNSS restore files) stays browser-modeled INSIDE the
  profile directory — the PIS never models it (RFC-013 §3 boundary).
  The schema has TWO LAYERS with different truth and different owners:
    LAYER 1 — LOCAL MANIFEST + STAGING CACHE (session.json, downloads/,
      screenshots/, events.jsonl): custody/runtime state + captured
      artifacts pending drain, owned by the session daemon on the machine
      that runs the browser. Never PIS truth. The staging area is a CACHE,
      not a residence (RFC-013 ingestion register, D-1/D-3): steady state
      is drained and near-empty — the sessions-importer provider pulls
      everything into MemoGarden's content-addressed store and deletes
      the staged copy; undrained captures are never evicted (loss-free).
    LAYER 2 — SOIL VOCABULARY: the session entity's config + the fact-shaped
      events the daemon emits, mirrored asynchronously into Soil by the
      sessions-importer provider (drain; facts only — Core entities come
      via the session-entity slice). Invariant: live arbitration is local
      (a control transition never blocks on the drain).

# ==============================================================================
# LAYER 1 — LOCAL MANIFEST (custody/runtime state; daemon-owned)
# ==============================================================================
# Files on disk (root: $MEMOGARDEN_SESSIONS_ROOT or
# ~/.local/share/memogarden/sessions/):
#   <name>/profile/        Chromium user-data-dir — the dehydrated state itself
#   <name>/session.json    this manifest
#   <name>/browser.log     stdout/stderr of the most recent open
#   <name>/downloads/      STAGING: captured downloads, deleted on drain
#                          (sessions-importer; see download_captured event)
#   <name>/screenshots/    STAGING: screenshot verb output, deleted on drain
#   <name>/events.jsonl    fact-shaped event log (LAYER 2 vocabulary, local;
#                          drain watermark = per-session seq)

manifest:
  name:
    type: string
    required: true
    pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    description: Session handle; also the directory name. Lowercase/digits/dashes.
    example: "dbs"
  created_at:
    type: string (ISO datetime, local)
    required: true
  last_opened_at:
    type: string (ISO datetime, local)
    required: false
  machine:
    type: string (hostname)
    required: true
    description: Sessions are MACHINE-BOUND (HACM-store precedent); they do
      not roam. Remote clients (mobile) direct, never run (RFC-013 §9).
  state:
    type: string
    required: true
    enum: ["dehydrated", "open"]
    description: dehydrated = profile on disk, zero processes. open = a live
      browser holds the profile (single-flight, enforced by profile lock +
      pid/cmdline identity check).
    example: "dehydrated"
  pid:
    type: int | null
    required: false
    description: Main browser process (cmdline carries the profile dir AND
      lacks --type=; child processes also carry --user-data-dir). Stale pids
      recover automatically on the next command.
  extra_extensions:
    type: [string] (absolute dirs of unpacked extensions)
    required: false
    description: Per-session extension assignment (RFC-013 §12.2 companion
      extension is always loaded; this list adds user extensions). Primary
      use: per-session password-manager assignment — e.g. dbs=1password,
      some-other-session=bitwarden. Future home of the assignment: Core
      session config, synced to the manifest.

  # NOTE: deliberately ABSENT from the manifest (PIS truth lives in Core):
  #   labels, scopes, project/document links, desired_state, password-manager
  #   assignment (until Core config exists and syncs it down).

# ==============================================================================
# LAYER 2 — CORE VOCABULARY (fact-shaped; currently local events.jsonl,
# future mirror into Core facts — same JSON shapes)
# ==============================================================================
# Common envelope: {ts, seq, event, tab?, label?, actor, from?, to?, ...extra}
# actor ∈ Operator | Agent (RFC-010 entities, mapped at API-extraction time)
# All transitions are explicit named events; refusals are logged too (audit).

control_facts:            # co-control, per TAB (control unit = tab)
  event: agent_request          # agent asks for a tab            -> pending
  event: operator_grant         # operator approves               -> agent-held
  event: operator_commandeer    # operator override, optional
                                #   `reason` recorded on the event -> operator
  event: agent_release          # agent yields                    -> operator
  event: transition_refused     # illegal transition attempt (audited)
  event: dispatch_refused       # gated agent dispatch on non-agent-held tab
  event: unregister_tab         # tab left the session (user closed it)

  # Invariants (RFC-013 §5, refined §12): control unit = tab; operator
  # sovereignty (commandeer always legal, agent always yields); the operator
  # is never SILENTLY locked out (soft locks surface an immediate override);
  # agent-side gating only.

lifecycle_facts:          # per session
  event: session_created
  event: session_opened         # mode: governed | detached
  event: session_dehydrated     # cache_reclaimed bytes on the event
  event: session_rehydrated
  event: session_culled         # profile deleted (reserved; refuses when
                                #   staging cache non-empty — never strand
                                #   undrained captures)
  event: download_captured      # IMPLEMENTED 2026-11-18 (register C1/D2):
                                #   filename, url, size, content_type,
                                #   captured_at, downloaded_by (arbiter tab
                                #   state: operator|agent|unknown), session,
                                #   machine. The drain folds this event into
                                #   the Attachment fact's metadata (gmail-
                                #   parity kind; D2) — never a separate fact.
                                #   Drain path PROVEN live on UOB (2026-11-18:
                                #   first real drain, sha256-verified).

  # Dehydration semantics (§6): SIGTERM close (complete crash-classified
  # snapshot; Chromium marks ALL programmatic closes as crashes — restore
  # works from the recovery path via --restore-last-session), Cache* purge
  # (cache != state: Cookies/Local Storage/Sessions/ kept), cache reclaimed
  # recorded. Rehydration is REQUESTED, never automatic (§8).

# ==============================================================================
# DRAIN (staging cache -> MemoGarden; implemented 2026-11-18/19)
# ==============================================================================
# Provider: `sessions` (providers/sessions-importer, in-server, interval 900s
# fallback). Decisions of record: plan/rfc_013_ingestion_decision_register.md.
#   semantics:    presence-as-queue (staged file present = pending)
#                 ack-after-commit (staged file deleted only after its fact
#                   is durably committed; crash-safe, never in `finally`)
#                 (session, sha256) dedup — at-least-once is harmless
#                 partials (.crdownload/.part/.tmp) never drain
#                 loss-free: undrained captures are never evicted (D-3)
#                 zero local retention post-drain; empty dirs pruned (F2)
#   fact shape:   gmail-parity Attachment; data {filename, mime_type, size,
#                 sha256, title, content_path}; metadata {provider=
#                 memogarden-sessions, source=browser_session, stream=
#                 downloads|screenshots, session, machine, account=<session>,
#                 url, downloaded_by, captured_at, storage_root, drained_at}
#   scoping:      all downloads -> Triage (runtime fail-closed default; D-4);
#                 Finances scope = manual triage destination; metadata.account
#                 (session name) stamped for future rules and relabeling
#   trigger:      daemon POSTs /providers/sessions/run after a session close
#                 with staged captures (D-2) using a TRIGGER-ONLY key
#                 (api_keys.capabilities=["provider_run"], E3 restricted
#                 class, Tier-1 env file agents/sessions-daemon/env 0600);
#                 fire-and-forget — failure never blocks close (INV-4);
#                 heartbeat drains if the trigger misses or Core was down.
#   planned streams: PageVisit facts (per-navigation, ALL sessions — C3) and
#                 the full §12.1 SessionEvent mirror incl. refusals (C4);
#                 download_captured is folded into Attachment metadata and
#                 never mirrored as a SessionEvent (D2).
#                 BOTH IMPLEMENTED 2026-11-19 (provider e29f438; daemon visit
#                 capture 73f8a03): events re-read per run with (session,
#                 seq, ts) dedup probes — NO seq watermark (deviation from
#                 B4, exact for legacy files whose seq reset across pre-fix
#                 daemon restarts). Scope policy LIVE: events/history
#                 streams unscoped (null rules), default triage (D-4).
#   session entity: IMPLEMENTED 2026-11-19 (register C5, provider 4414bba):
#                 every session upserts as a Core `Session` entity (ENTITY_
#                 UPSERTS contract, natural key (source=memogarden-sessions,
#                 session, machine) — machine-bound per RFC-013 §9), etag =
#                 manifest hash (noop rule); drained facts gain contained_by
#                 relations to the entity (backfill covers pre-slice facts;
#                 entities unscoped via the session_entity null rule). ⚠️
#                 Deploy note: registration has NO update path for derived
#                 capabilities — the ENTITY_UPSERTS addition needed a direct
#                 manifest UPDATE (validation-equivalent; API gap = follow-up).
#                 Live: dbs+uob entities, 94 relations, rerun noop.

# ==============================================================================
# SESSION CONFIG (Core-side entity attributes; future — daemon syncs down)
# ==============================================================================
config:
  label:
    type: string
    required: false
    description: Human handle (Core-side only; the manifest knows only `name`).
  purpose:
    type: string
    required: false
    description: Free text ("financial portals", "project: memogarden").
  password_manager:
    type: string
    required: false
    enum: ["1password", "bitwarden", "none"]
    description: Per-session extension assignment (user preference, 2026-11-15
      — NOT both-everywhere). Syncs to manifest.extra_extensions.
  extra_extensions:
    type: [string]
    required: false
    description: Beyond the password manager — per-session user extensions.
  links:
    type: [relation]
    required: false
    description: Sessions link to projects, scopes, documents — the Exhibit A/B
      graph ("session entities linked/attached to documents, notes, projects").
  desired_state:
    type: string
    required: false
    enum: ["idle", "rehydrated"]
    description: REQUESTED rehydration (e.g. set by a scope rule when a
      statement email lands) — surfaced human-visible, never auto-spawned.

# ==============================================================================
# AGENT VERB SURFACE (provisional — harvested from the 2026-11-15 live run;
# transport = daemon unix socket; agent identity mapping lands with the API)
# ==============================================================================
verbs_introspection:      # UNGATED — control gates input, not reads
  content:        {tab}                      # title/url/body text (4k)
  elements:       {tab}                      # interactive elements + indices
                                             #   (LIMITATION: main frame only;
                                             #   misses handler-divs — snapshot
                                             #   verb supersedes, see gaps)
  inspect_listeners: {tab, selector}         # DevTools getEventListeners
  downloads:      {name}                     # captured files
  tabs:           {name}                     # per-tab control states
  status:         {}                         # sessions + governed set

verbs_dispatch:           # GATED — agent-held tabs only; refusals logged
  navigate:       {tab, url}                 # POLICY PENDING (§12.6): entry/
                                             #   public URLs only — direct goto
                                             #   of authed deep-links trips bank
                                             #   session-integrity defenses
                                             #   (logged a user out, verified)
  fill:           {tab, selector, value}
  click:          {tab, selector}
  click_at:       {tab, index}               # from the elements enumeration
  paste:          {tab, selector}            # clipboard -> field INSIDE the
                                             #   browser (bypasses paste-block;
                                             #   only char count returns)
  type_clipboard: {tab, selector}            # TRUSTED keystrokes (isTrusted=
                                             #   true, 45ms) — defeats
                                             #   keystroke-buffer auth (UOB);
                                             #   secret lives in daemon memory
                                             #   only, agent sees char count

verbs_operator_only:      # never exposed to agents (sovereignty)
  open / close / daemon start / daemon stop / grant / commandeer

# RESOLVED (2026-11-16 slice, verified in verbs smoke):
#   snapshot {tab}: a11y-ish tree with STABLE REFS, all frames (cross-origin
#     included); refs addressable as target='ref:eN' or bare 'eN'/'f1eN' —
#     supersedes the elements/click_at pair as primary introspection
#   frames: every dispatch verb loops main frame -> all other frames
#   wait_for {tab, text|selector, timeout}: per-frame polling
#   new_tab/close_tab: Exhibit B branching; agent-created tabs auto-grant
#     to the agent; agents close only agent-held tabs
#   screenshot {tab, full_page}: PNG into <session>/screenshots/
# REMAINING:
#   - navigation policy encoding: entry-only goto vs in-app click graph
#     (RFC-013 §12.6 deferred)
#   - operator UI surface for send/grant/commandeer (deferred with the
#     operator->agent handover affordance)
